# The Hadrian fork's CI. Upstream's ci.yml and release.yml are kept byte-for-byte
# so merges stay clean and their contract tests keep passing, but they expect
# upstream's website, integrations and release channels: disable them in the
# repository's Actions settings and rely on this workflow (see FORK.md).
name: Hadrian CI

on:
  push:
    branches: [main, hadrian]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hadrian-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: generated outputs, English-only scan and full regression (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm --prefix archify ci --ignore-scripts
      - run: npm run test:full

  compatibility:
    name: core CLI smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm --prefix archify ci --ignore-scripts
      - run: npm run test:compat

  browser:
    name: browser gate including the Hadrian brand guards (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm --prefix archify ci --ignore-scripts
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/2
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'

  zip:
    name: archify.zip matches the tracked source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild archify.zip and compare exact bytes
        run: |
          scripts/build-zip.sh /tmp/archify-rebuilt.zip
          cmp archify.zip /tmp/archify-rebuilt.zip
